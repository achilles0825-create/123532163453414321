<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam級槍戰 RPG - 帳號登入熔煉版</title>
    <style>
        /* 全局深色底色與基本設定 */
        html, body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ========================================== */
        /* 1. 初始登入 / 註冊 介面樣式 */
        /* ========================================== */
        .auth-container {
            background-color: #262626;
            border: 2px solid #ff4444;
            border-radius: 8px;
            padding: 30px;
            width: 350px;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.2);
            z-index: 999; /* 確保在最上層 */
            display: block;
        }

        .auth-header h2 {
            text-align: center;
            margin: 0 0 15px 0;
            color: #ff4444;
            font-size: 22px;
            letter-spacing: 2px;
        }

        .auth-tabs {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 1px solid #404040;
        }

        .tab-btn {
            background: none;
            border: none;
            color: #888888;
            font-size: 16px;
            padding: 10px 0;
            cursor: pointer;
            width: 50%;
            text-align: center;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: #ff4444;
            border-bottom: 3px solid #ff4444;
            font-weight: bold;
        }

        .form-block {
            display: none;
        }

        .form-block.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #cccccc;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background-color: #333333;
            border: 1px solid #555555;
            color: #ffffff;
            border-radius: 4px;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #ff4444;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #cc3333;
        }

        .switch-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #aaa;
            font-size: 13px;
            text-decoration: none;
            cursor: pointer;
        }

        /* ========================================== */
        /* 2. 遊戲主畫面（戰區系統連線）全螢幕容器 */
        /* ========================================== */
        #game-screen {
            display: none; /* 初始隱藏，登入後展開 */
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0b0f19;
            box-sizing: border-box;
            padding: 15px;
            flex-direction: column;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #00ffcc;
            padding-bottom: 10px;
            margin-bottom: 15px;
            height: 40px;
        }

        .game-title {
            color: #00ffcc;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        .agent-info {
            font-size: 15px;
            color: #ffffff;
            background: #1f293d;
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid #00ffcc;
        }

        /* ========================================== */
        /* 3. 內嵌原本功能網頁的無邊框畫布區 (Iframe) */
        /* ========================================== */
        .game-frame-container {
            width: 100%;
            height: calc(100vh - 90px); /* 自動扣除頂部狀態列 */
            border: 2px dashed #00ffcc;
            border-radius: 6px;
            background-color: #000000;
            box-shadow: inset 0 0 20px rgba(0, 255, 204, 0.2);
        }

        #game-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: transparent;
        }
    </style>
</head>
<body>

<div class="auth-container" id="auth-box">
    <div class="auth-header">
        <h2>特工簽到中心</h2>
    </div>

    <div class="auth-tabs">
        <button id="tab-login" class="tab-btn active" onclick="switchTab('login')">執行登入</button>
        <button id="tab-register" class="tab-btn" onclick="switchTab('register')">前往註冊</button>
    </div>

    <div id="form-login" class="form-block active">
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>特工代號 (帳號)</label>
                <input type="text" id="login-username" required placeholder="請輸入您的特工代號">
            </div>
            <div class="form-group">
                <label>安全密鑰 (密碼)</label>
                <input type="password" id="login-password" required placeholder="請輸入安全密鑰">
            </div>
            <button type="submit" class="submit-btn">執行登入進駐</button>
        </form>
        <a class="switch-link" onclick="switchTab('register')">新來的特工？ 前往註冊帳籍</a>
    </div>

    <div id="form-register" class="form-block">
        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>新特工代號 (帳號)</label>
                <input type="text" id="reg-username" required placeholder="請設定新代號">
            </div>
            <div class="form-group">
                <label>設定安全密鑰 (密碼)</label>
                <input type="password" id="reg-password" required placeholder="請設定安全密鑰">
            </div>
            <button type="submit" class="submit-btn">建立特工帳籍</button>
        </form>
        <a class="switch-link" onclick="switchTab('login')">已有特工帳籍？ 前往登入簽到</a>
    </div>
</div>

<div id="game-screen">
    <div class="game-header">
        <div class="game-title">戰區系統已連線 CORE_SYS_v1.0.2</div>
        <div class="agent-info">當前特工：<span id="display-agent-id">未知</span></div>
    </div>
    
    <div class="game-frame-container">
        <iframe id="game-iframe" src="" title="熔煉遊戲主體"></iframe>
    </div>
</div>

<script>
    // 1. 分頁切換邏輯
    function switchTab(type) {
        const loginForm = document.getElementById('form-login');
        const registerForm = document.getElementById('form-register');
        const loginTab = document.getElementById('tab-login');
        const registerTab = document.getElementById('tab-register');

        if (type === 'login') {
            loginForm.classList.add('active');
            registerForm.classList.remove('active');
            loginTab.classList.add('active');
            registerTab.classList.remove('active');
        } else if (type === 'register') {
            registerForm.classList.add('active');
            loginForm.classList.remove('active');
            registerTab.classList.add('active');
            loginTab.classList.remove('active');
        }
    }

    // 2. 登入成功 -> 跳出提示 -> 連線並載入原本的遊戲網頁
    function handleLogin(event) {
        event.preventDefault();
        const user = document.getElementById('login-username').value;
        
        // 原本要求的提示訊息
        alert(`特工 ${user} 正在嘗試執行登入進駐...`);
        
        // 將特工名稱寫入右上角狀態列
        document.getElementById('display-agent-id').innerText = user;
        
        // 隱藏登入介面，顯示全螢幕戰區
        document.getElementById('auth-box').style.display = 'none';
        
        const gameScreen = document.getElementById('game-screen');
        gameScreen.style.display = 'flex'; // 展開戰區主畫面
        
        // 🎯 核心關鍵：將原本的遊戲網址指派給內嵌框架，讓它在戰區連線後立刻加載並運行原本的功能
        document.getElementById('game-iframe').src = "https://achilles0825-create.github.io/456836/";
    }

    // 3. 註冊成功邏輯
    function handleRegister(event) {
        event.preventDefault();
        const user = document.getElementById('reg-username').value;
        alert(`正在為新特工 ${user} 建立帳籍... 建立完成！請登入進駐。`);
        switchTab('login');
    }
</script>

</body>
</html>
